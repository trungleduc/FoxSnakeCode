name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: '2.3.2-0'
          environment-name: release-env
          create-args: >-
            python=3.12
            pip
            jupyterlab=4
            nodejs=22

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          set -eux
          python -m pip install -U "jupyter-builder>=1.2.2" build hatchling hatch-nodejs-version hatch-jupyter-builder
          jlpm install

      - name: Release
        shell: bash -l {0}
        run: jlpm semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: hashFiles('dist/*.whl') != ''
        uses: pypa/gh-action-pypi-publish@release/v1
