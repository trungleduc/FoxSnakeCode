[build-system]
requires = [
    "hatchling>=1.5.0",
    "jupyterlab>=4.0.0,<5",
    "hatch-nodejs-version>=0.3.2",
]
build-backend = "hatchling.build"

[project]
name = "foxsnakecode"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version", "description", "authors", "keywords"]
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python :: 3",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["foxsnakecode/labextension"]
exclude = [".github", "node_modules"]

[tool.hatch.build.targets.wheel.shared-data]
"foxsnakecode/labextension" = "share/jupyter/labextensions/foxsnakecode"
"install.json" = "share/jupyter/labextensions/foxsnakecode/install.json"

[tool.hatch.build.hooks.version]
path = "foxsnakecode/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "foxsnakecode/labextension/static/style.js",
    "foxsnakecode/labextension/package.json",
]
skip-if-exists = ["foxsnakecode/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "build"
npm = ["jlpm"]
source_dir = "src"
build_dir = "foxsnakecode/labextension"
